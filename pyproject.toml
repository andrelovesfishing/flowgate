[project]
name = "flowgate"
version = "0.1.0"
description = "Label-free scope gates from few-step likelihood flow maps over frozen sentence embeddings"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "transformers>=4.48",
  "datasets>=2.18",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
flowgate = "flowgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
